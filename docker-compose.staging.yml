# ==============================================================================
# CEDRUS DOCKER COMPOSE - STAGING ENVIRONMENT
# ==============================================================================
version: '3.9'

networks:
  cedrus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: cedrus-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: cedrus_next
      POSTGRES_USER: cedrus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cedrus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedrus -d cedrus_next"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/postgresql
      - /tmp

  redis:
    image: redis:7-alpine
    container_name: cedrus-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - cedrus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cedrus-web-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - cedrus-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3000/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
