name: Verify Secrets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-secrets:
    name: Verify secrets are available
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Confirm AUTH_SECRET is present
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -z "$AUTH_SECRET" ]; then
            echo "AUTH_SECRET is not set" >&2
            exit 1
          else
            echo "AUTH_SECRET is present (masked)"
          fi

      - name: Confirm DATABASE_URL is present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set" >&2
            exit 1
          else
            echo "DATABASE_URL is present (masked)"
          fi
