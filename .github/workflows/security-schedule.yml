name: Security Schedule (Weekly)

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: Dependency Audit (npm audit)
  # -----------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

  # -----------------------------------------------------------------------------
  # JOB 2: Container Scan (Trivy)
  # -----------------------------------------------------------------------------
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t cedrus:latest .

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cedrus:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cedrus:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

  # -----------------------------------------------------------------------------
  # JOB 3: DAST (OWASP ZAP Baseline Scan)
  # Requires STAGING_URL variable set in repository/environment settings.
  # -----------------------------------------------------------------------------
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    if: vars.STAGING_URL != ''
    steps:
      - uses: actions/checkout@v6

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          fail_action: false
          cmd_options: '-a'
          artifact_name: zap_scan

  # -----------------------------------------------------------------------------
  # JOB 4: Secret Scanning (Gitleaks)
  # -----------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source /github/workspace --verbose --redact -c /github/workspace/.gitleaks.toml

  # -----------------------------------------------------------------------------
  # JOB 5: SBOM Generation (CycloneDX via npm)
  # -----------------------------------------------------------------------------
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: frontend/sbom.json
          retention-days: 90
