# ==============================================================================
# CEDRUS DOCKER COMPOSE - DEVELOPMENT ENVIRONMENT
# ==============================================================================
# Stack:
#   - Next.js 15 (port 3000)
#   - PostgreSQL 16 (port 5432)
#   - Redis 7 (port 6379)
# ==============================================================================

version: '3.9'

networks:
  cedrus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cedrus-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cedrus_next
      POSTGRES_USER: cedrus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cedrus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedrus -d cedrus_next"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/postgresql
      - /tmp

  # ────────────────────────────────────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cedrus-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - cedrus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # ────────────────────────────────────────────────────────────────────────────
  # Next.js Application
  # ────────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cedrus-web-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - cedrus-network
    security_opt:
      - no-new-privileges:true
